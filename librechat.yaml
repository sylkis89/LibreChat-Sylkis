version: "1.3.14"
cache: true

# Your Cloudflare R2/S3-compatible storage
fileStrategy: "s3"

interface:
  modelSelect: true
  parameters: true
  presets: true

  prompts:
    use: true
    create: true
    share: false
    public: false

  bookmarks: true
  multiConvo: true

  agents:
    use: true
    create: true
    share: false
    public: false

  fileSearch: true
  fileCitations: true
  webSearch: true

  defaultPinnedTools:
    - "web_search"
    - "file_search"
    - "artifacts"
    - "skills"
    - "mcp"

  mcpServers:
    use: true
    create: false
    share: false
    public: false

endpoints:

  # =========================
  # Native Google / Gemini
  # =========================
  google:
    apiKey: "${GOOGLE_KEY}"
    models:
      default:
        - "gemini-3.6-flash"
        - "gemini-3.5-flash"
        - "gemini-3.5-flash-lite"
      fetch: true

  # =========================
  # Agents
  # =========================
  agents:
    disableBuilder: false

    capabilities:
      - "deferred_tools"
      - "execute_code"
      - "file_search"
      - "web_search"
      - "artifacts"
      - "subagents"
      - "actions"
      - "context"
      - "skills"
      - "tools"
      - "chain"
      - "ocr"
      - "memory"

    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45

  # =========================
  # OpenAI-compatible custom endpoints
  # =========================
  custom:

    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "meta-llama/llama-3-70b-instruct"
        fetch: true
      modelDisplayLabel: "OpenRouter"

    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default:
          - "deepseek-chat"
        fetch: true
      modelDisplayLabel: "DeepSeek"

    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1"
      models:
        default:
          - "llama-3.3-70b-versatile"
        fetch: true
      modelDisplayLabel: "Groq"

    - name: "Cerebras"
      apiKey: "${CEREBRAS_API_KEY}"
      baseURL: "https://api.cerebras.ai/v1"
      models:
        default:
          - "zai-glm-4.7"
        fetch: true
      modelDisplayLabel: "Cerebras"

    - name: "Cohere"
      apiKey: "${COHERE_API_KEY}"
      baseURL: "https://api.cohere.ai/compatibility/v1"
      models:
        default:
          - "command-a-plus-05-2026"
        fetch: true
      modelDisplayLabel: "Cohere"

    - name: "Mistral"
      apiKey: "${MISTRAL_API_KEY}"
      baseURL: "https://api.mistral.ai/v1"
      models:
        default:
          - "mistral-large-latest"
        fetch: true
      dropParams:
        - "stop"
        - "user"
        - "frequency_penalty"
        - "presence_penalty"
      modelDisplayLabel: "Mistral"

    - name: "Moonshot"
      apiKey: "${MOONSHOT_API_KEY}"
      baseURL: "https://api.moonshot.cn/v1"
      models:
        default:
          - "moonshot-v1-8k"
        fetch: true
      modelDisplayLabel: "Moonshot"

    - name: "Qwen"
      apiKey: "${QWEN_API_KEY}"
      baseURL: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
      models:
        default:
          - "qwen-max"
        fetch: true
      modelDisplayLabel: "Qwen"

    - name: "Hugging Face"
      apiKey: "${HUGGINGFACE_API_KEY}"
      baseURL: "https://router.huggingface.co/v1"
      models:
        default:
          - "deepseek-ai/DeepSeek-V3-0324"
        fetch: true
      modelDisplayLabel: "Hugging Face"

# =========================
# OCR
# =========================
ocr:
  strategy: "mistral_ocr"
  apiKey: "${OCR_API_KEY}"
  baseURL: "${OCR_BASEURL}"
  mistralModel: "mistral-ocr-latest"

# =========================
# Web Search
# =========================
#
# SearXNG is the built-in Web Search provider.
# Tavily remains available as a separate Agent tool because
# TAVILY_API_KEY is also configured.
#
webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"

  scraperProvider: "firecrawl"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"

  tavilyApiKey: "${TAVILY_API_KEY}"

  rerankerType: "cohere"
  cohereApiKey: "${COHERE_API_KEY}"

  safeSearch: 1
  scraperTimeout: 10000

# =========================
# Speech / TTS
# =========================
speech:
  tts:
    elevenlabs:
      apiKey: "${ELEVENLABS_API_KEY}"
      model: "eleven_multilingual_v2"
      voices:
        - "21m00Tcm4TlvDq8ikWAM"
        - "AZnzlk1XvdvUeBnXmlld"

  speechTab:
    conversationMode: false
    advancedMode: true
    speechToText: true
    textToSpeech: true

# =========================
# MCP servers
# =========================
#
# These expose services that are not normal LLM endpoints.
# startup: false prevents external MCP services from delaying
# LibreChat's boot; they initialise when selected.
#
mcpServers:

  # Exa search / research tools
  exa:
    type: "streamable-http"
    url: "https://mcp.exa.ai/mcp?exaApiKey=${EXA_API_KEY}"
    chatMenu: true
    serverInstructions: true
    requiresOAuth: false
    startup: false

  # fal.ai: image, video, audio, 3D, upscaling, etc.
  fal-ai:
    type: "streamable-http"
    url: "https://mcp.fal.ai/mcp"
    headers:
      Authorization: "Bearer ${FAL_KEY}"
    chatMenu: true
    serverInstructions: true
    requiresOAuth: false
    startup: false

  # Pollinations: image, video, audio and other generative tools
  pollinations:
    type: "stdio"
    command: "npx"
    args:
      - "-y"
      - "@pollinations/mcp"
    env:
      POLLINATIONS_API_KEY: "${POLLINATIONS_API_KEY}"
    chatMenu: true
    serverInstructions: true
    startup: false

  # Hugging Face MCP / Hub tools
  huggingface-tools:
    type: "streamable-http"
    url: "https://hf.co/mcp"
    headers:
      Authorization: "Bearer ${HUGGINGFACE_API_KEY}"
    chatMenu: true
    serverInstructions: true
    requiresOAuth: false
    startup: false

  # Qdrant vector-database tools
  qdrant:
    type: "stdio"
    command: "uvx"
    args:
      - "mcp-server-qdrant"
    env:
      QDRANT_URL: "${QDRANT_URL}"
      QDRANT_API_KEY: "${QDRANT_API_KEY}"
      COLLECTION_NAME: "librechat"
    chatMenu: true
    serverInstructions: true
    startup: false

  # Unstructured document-processing tools
  unstructured:
    type: "stdio"
    command: "uvx"
    args:
      - "uns_mcp"
    env:
      UNSTRUCTURED_API_KEY: "${UNSTRUCTURED_API_KEY}"
      UNSTRUCTURED_API_URL: "${UNSTRUCTURED_API_URL}"
    chatMenu: true
    serverInstructions: true
    startup: false      models:
        default:
          - "mistral-large-latest"
        fetch: true
      dropParams:
        - "stop"
        - "user"
        - "frequency_penalty"
        - "presence_penalty"
      modelDisplayLabel: "Mistral"

    - name: "Moonshot"
      apiKey: "${MOONSHOT_API_KEY}"
      baseURL: "https://api.moonshot.cn/v1"
      models:
        default:
          - "moonshot-v1-8k"
        fetch: true
      modelDisplayLabel: "Moonshot"

    - name: "Qwen"
      apiKey: "${QWEN_API_KEY}"
      baseURL: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
      models:
        default:
          - "qwen-max"
        fetch: true
      modelDisplayLabel: "Qwen"
